 <!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>My Jaan 💗</title>

<link rel="stylesheet" href="/story.css?v=story-spotify-2">
</head>


<body>


<!-- =======================================================
     BACKGROUND
======================================================= -->

<div class="page">

    <div class="aurora"></div>

    <div class="orb orb1"></div>

    <div class="orb orb2"></div>

    <canvas id="particles"></canvas>

</div>


<!-- =======================================================
     STAGE
======================================================= -->

<main class="stage">


<div
    class="card"
    id="card"
>


    <div class="card-light"></div>


    <!-- CORNER EMOJIS -->

    <div class="corner a">💗</div>
    <div class="corner b">✨</div>
    <div class="corner c">🫶</div>
    <div class="corner d">💘</div>


    <!-- =================================================
         INITIAL GIFT SCREEN
    ================================================== -->

    <section
        class="gift-screen"
        id="giftScreen"
    >

        <div class="gift-halo"></div>


        <div
            class="gift-wrap"
            id="gift"
            aria-label="Open gift"
        >

            <div class="gift-lid"></div>

            <div class="gift-bow">
                🎀
            </div>

            <div class="gift-box"></div>

        </div>


        <div
            class="tap-label"
            id="tapLabel"
        >
            🎁 TAP TO OPEN 🎁
        </div>

    </section>


    <!-- =================================================
         REVEAL
    ================================================== -->

    <section
        class="reveal"
        id="reveal"
    >


        <!-- HEART -->

        <div class="big-heart">

            <div class="heart-emoji">
                💖
            </div>

        </div>


        <!-- TITLE -->

        <h1 class="title">
            Love My Jaan
        </h1>

        <p class="story-personal-message" id="storyMessage" hidden></p>


        <!-- EMOJIS -->

        <div class="emoji-line">

            <span>💗</span>
            <span>💖</span>
            <span>💘</span>
            <span>💕</span>
            <span>💞</span>
            <span>💓</span>
            <span>🥰</span>
            <span>🫶</span>
            <span>❤️‍🔥</span>

        </div>


        <!-- MAIN CLICK -->

        <button
            class="main-button"
            id="mainButton"
        >
            💖 CLICK ME 💖
        </button>

        <button class="music-toggle" id="music-toggle" type="button" aria-pressed="true">♫ Pause tune</button>


        <!-- ACTION BUTTONS -->

        <div class="action-row">


            <button
                class="action"
                data-type="love"
                aria-label="Love"
            >
                💗
            </button>


            <button
                class="action"
                data-type="kiss"
                aria-label="Kiss"
            >
                😘
            </button>


            <button
                class="action"
                data-type="hug"
                aria-label="Hug"
            >
                🫂
            </button>


            <button
                class="action"
                data-type="heart"
                aria-label="Heart"
            >
                💘
            </button>


            <button
                class="action"
                data-type="flower"
                aria-label="Flowers"
            >
                🌹
            </button>


            <button
                class="action"
                data-type="sparkle"
                aria-label="Sparkle"
            >
                ✨
            </button>


            <button
                class="action"
                data-type="party"
                aria-label="Party"
            >
                🎉
            </button>


            <button
                class="action"
                data-type="fire"
                aria-label="Fire"
            >
                ❤️‍🔥
            </button>


        </div>


    </section>


</div>

</main>
<section class="story-spotify-player" id="story-spotify-track" aria-label="Story music" hidden></section>
<section class="story-gallery" id="memoryWall" aria-labelledby="memoryHeading" hidden>
  <header class="story-gallery-head"><span class="story-gallery-kicker">A COLLECTION OF LITTLE MOMENTS</span><h2 id="memoryHeading">Our memories <span>♡</span></h2><p id="storySubtitle">Every photo, video and message, together.</p></header>
  <nav class="story-filters" id="story-filters" aria-label="Filter story memories">
    <button type="button" data-story-filter="all" aria-pressed="true">All</button>
    <button type="button" data-story-filter="image" aria-pressed="false">Photos</button>
    <button type="button" data-story-filter="video" aria-pressed="false">Videos</button>
    <button type="button" data-story-filter="note" aria-pressed="false">Notes</button>
  </nav>
  <div class="story-grid" id="story-memories"></div>
  <p class="story-load-error" id="story-error" role="status"></p>
</section>
<div class="story-viewer" id="story-viewer" role="dialog" aria-modal="true" aria-label="Memory viewer" hidden>
  <button class="story-viewer-close" id="story-viewer-close" type="button" aria-label="Close memory">×</button>
  <div class="story-viewer-content" id="story-viewer-content"></div>
</div>


<script src="/story.js?v=story-spotify-2" defer></script>

</body>
</html>
