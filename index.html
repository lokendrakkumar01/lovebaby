 <!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>My Jaan 💗</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
}

body{

    overflow:hidden;

    font-family:
        Inter,
        "Segoe UI",
        system-ui,
        -apple-system,
        sans-serif;

    color:white;

    background:#070008;
}


/* =========================================================
   BACKGROUND
========================================================= */

.page{

    position:fixed;
    inset:0;

    overflow:hidden;

    background:

        radial-gradient(
            circle at 50% 45%,
            rgba(255,40,120,.15),
            transparent 30%
        ),

        radial-gradient(
            circle at 15% 20%,
            rgba(255,0,100,.10),
            transparent 30%
        ),

        radial-gradient(
            circle at 85% 80%,
            rgba(150,0,255,.12),
            transparent 30%
        ),

        linear-gradient(
            135deg,
            #060006,
            #12000d 45%,
            #080009
        );
}


/* =========================================================
   AURORA
========================================================= */

.aurora{

    position:absolute;

    width:75vw;
    height:75vw;

    max-width:850px;
    max-height:850px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:

        conic-gradient(
            from 0deg,
            transparent,
            rgba(255,0,100,.10),
            transparent,
            rgba(180,0,255,.08),
            transparent
        );

    filter:blur(50px);

    animation:
        auroraRotate
        18s
        linear
        infinite;

    pointer-events:none;
}

@keyframes auroraRotate{

    to{
        transform:
            translate(-50%,-50%)
            rotate(360deg);
    }
}


/* =========================================================
   GLOW ORBS
========================================================= */

.orb{

    position:absolute;

    border-radius:50%;

    filter:blur(80px);

    pointer-events:none;

    opacity:.45;
}

.orb1{

    width:260px;
    height:260px;

    background:#ff0066;

    top:-100px;
    left:-80px;

    animation:
        orbOne
        9s
        ease-in-out
        infinite
        alternate;
}

.orb2{

    width:300px;
    height:300px;

    background:#8200ff;

    right:-130px;
    bottom:-120px;

    animation:
        orbTwo
        11s
        ease-in-out
        infinite
        alternate;
}

@keyframes orbOne{

    to{
        transform:
            translate(180px,140px)
            scale(1.25);
    }
}

@keyframes orbTwo{

    to{
        transform:
            translate(-180px,-130px)
            scale(1.3);
    }
}


/* =========================================================
   PARTICLE CANVAS
========================================================= */

#particles{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    pointer-events:none;

    z-index:2;
}


/* =========================================================
   MAIN STAGE
========================================================= */

.stage{

    position:relative;

    width:100%;
    height:100%;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:18px;

    z-index:10;
}


/* =========================================================
   CARD
========================================================= */

.card{

    position:relative;

    width:min(680px,94vw);

    min-height:min(720px,94vh);

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    padding:
        30px 28px;

    border-radius:38px;

    background:

        linear-gradient(
            145deg,
            rgba(255,255,255,.10),
            rgba(255,255,255,.025)
        );

    border:
        1px solid
        rgba(255,255,255,.16);

    backdrop-filter:
        blur(28px)
        saturate(130%);

    -webkit-backdrop-filter:
        blur(28px)
        saturate(130%);

    box-shadow:

        0 35px 100px
        rgba(0,0,0,.60),

        inset 0 1px 0
        rgba(255,255,255,.10);

    transform-style:preserve-3d;

    transition:
        transform .18s ease;

    overflow:hidden;

    animation:
        cardIn
        1s
        cubic-bezier(.2,.8,.2,1);
}

@keyframes cardIn{

    from{
        opacity:0;
        transform:
            scale(.88)
            translateY(40px);
    }

    to{
        opacity:1;
        transform:
            scale(1)
            translateY(0);
    }
}


/* =========================================================
   CARD LIGHT
========================================================= */

.card-light{

    position:absolute;

    width:280px;
    height:280px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,70,150,.18),
            transparent 68%
        );

    left:50%;
    top:25%;

    transform:
        translate(-50%,-50%);

    pointer-events:none;
}


/* =========================================================
   TOP DECOR
========================================================= */

.corner{

    position:absolute;

    font-size:22px;

    opacity:.8;

    filter:
        drop-shadow(
            0 0 8px
            rgba(255,70,150,.7)
        );

    animation:
        cornerFloat
        4s
        ease-in-out
        infinite;
}

.corner.a{
    top:22px;
    left:24px;
}

.corner.b{
    top:25px;
    right:25px;
    animation-delay:.8s;
}

.corner.c{
    bottom:22px;
    left:25px;
    animation-delay:1.5s;
}

.corner.d{
    bottom:25px;
    right:24px;
    animation-delay:2.1s;
}

@keyframes cornerFloat{

    50%{
        transform:
            translateY(-8px)
            rotate(8deg)
            scale(1.1);
    }
}


/* =========================================================
   GIFT SCREEN
========================================================= */

.gift-screen{

    position:relative;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    transition:
        opacity .7s ease,
        transform .7s ease;

    z-index:20;
}

.gift-screen.hide{

    opacity:0;

    transform:
        scale(.7)
        translateY(-30px);

    pointer-events:none;
}


/* =========================================================
   GIFT HALO
========================================================= */

.gift-halo{

    position:absolute;

    width:220px;
    height:220px;

    border-radius:50%;

    border:
        1px solid
        rgba(255,90,160,.18);

    animation:
        haloPulse
        2.4s
        ease-out
        infinite;
}

@keyframes haloPulse{

    0%{
        transform:scale(.65);
        opacity:.9;
    }

    100%{
        transform:scale(1.4);
        opacity:0;
    }
}


/* =========================================================
   GIFT
========================================================= */

.gift-wrap{

    position:relative;

    width:190px;
    height:185px;

    display:flex;

    align-items:flex-end;
    justify-content:center;

    cursor:pointer;

    transition:
        transform .35s ease;
}

.gift-wrap:hover{

    transform:
        translateY(-7px)
        scale(1.04);
}


/* gift box */

.gift-box{

    position:absolute;

    width:125px;
    height:100px;

    bottom:10px;

    border-radius:10px;

    background:

        linear-gradient(
            135deg,
            #ff3c80,
            #c30951
        );

    box-shadow:

        0 20px 50px
        rgba(255,20,100,.40);
}


/* vertical ribbon */

.gift-box::before{

    content:"";

    position:absolute;

    width:22px;
    height:100%;

    left:50%;

    transform:
        translateX(-50%);

    background:#ffe0ea;
}


/* horizontal ribbon */

.gift-box::after{

    content:"";

    position:absolute;

    width:100%;
    height:18px;

    top:42px;

    background:#ffe0ea;
}


/* lid */

.gift-lid{

    position:absolute;

    width:145px;
    height:28px;

    bottom:96px;

    left:50%;

    transform:
        translateX(-50%);

    border-radius:8px;

    background:

        linear-gradient(
            135deg,
            #ff5996,
            #d20c56
        );

    z-index:5;

    transition:
        transform
        .9s
        cubic-bezier(.2,.9,.2,1);
}


/* bow */

.gift-bow{

    position:absolute;

    bottom:112px;

    left:50%;

    transform:
        translateX(-50%);

    font-size:45px;

    z-index:10;

    transition:
        .8s
        cubic-bezier(.2,.9,.2,1);
}


/* gift opening */

.gift-wrap.open .gift-lid{

    transform:
        translateX(-50%)
        translateY(-105px)
        rotate(-12deg);
}

.gift-wrap.open .gift-bow{

    transform:
        translateX(-50%)
        translateY(-120px)
        rotate(25deg)
        scale(.7);

    opacity:0;
}

.gift-wrap.open .gift-box{

    animation:
        giftShake
        .65s
        ease;
}

@keyframes giftShake{

    0%,100%{
        transform:translateX(0);
    }

    20%{
        transform:translateX(-7px) rotate(-2deg);
    }

    40%{
        transform:translateX(7px) rotate(2deg);
    }

    60%{
        transform:translateX(-5px);
    }

    80%{
        transform:translateX(5px);
    }
}


/* =========================================================
   TAP LABEL
========================================================= */

.tap-label{

    margin-top:10px;

    font-size:12px;

    font-weight:700;

    letter-spacing:4px;

    color:
        rgba(255,190,215,.85);

    animation:
        tapPulse
        1.5s
        ease-in-out
        infinite;
}

@keyframes tapPulse{

    50%{
        opacity:.4;
        transform:scale(.97);
    }
}


/* =========================================================
   REVEAL SCREEN
========================================================= */

.reveal{

    position:absolute;

    inset:0;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    padding:30px;

    opacity:0;

    visibility:hidden;

    transform:
        scale(.75)
        translateY(30px);

    transition:
        opacity .9s ease,
        transform .9s cubic-bezier(.2,.8,.2,1),
        visibility 0s linear .9s;

    z-index:15;
}

.reveal.show{

    opacity:1;

    visibility:visible;

    transform:
        scale(1)
        translateY(0);

    transition:
        opacity .9s ease,
        transform .9s cubic-bezier(.2,.8,.2,1),
        visibility 0s;
}


/* =========================================================
   BIG HEART
========================================================= */

.big-heart{

    position:relative;

    width:145px;
    height:145px;

    display:flex;

    align-items:center;
    justify-content:center;
}

.big-heart::before,
.big-heart::after{

    content:"";

    position:absolute;

    inset:0;

    border-radius:50%;

    border:
        1px solid
        rgba(255,60,140,.30);

    animation:
        heartRing
        2.4s
        ease-out
        infinite;
}

.big-heart::after{

    animation-delay:
        1.2s;
}

.heart-emoji{

    font-size:92px;

    z-index:2;

    animation:
        heartbeat
        1.15s
        infinite;

    filter:

        drop-shadow(
            0 0 12px #ff1f70
        )

        drop-shadow(
            0 0 35px #ff1f70
        )

        drop-shadow(
            0 0 70px
            rgba(255,0,110,.55)
        );
}

@keyframes heartbeat{

    0%,100%{
        transform:scale(1);
    }

    15%{
        transform:scale(1.18);
    }

    30%{
        transform:scale(1);
    }

    45%{
        transform:scale(1.10);
    }

    60%{
        transform:scale(1);
    }
}

@keyframes heartRing{

    0%{
        transform:scale(.55);
        opacity:.8;
    }

    100%{
        transform:scale(1.55);
        opacity:0;
    }
}


/* =========================================================
   TITLE
========================================================= */

.title{

    margin-top:14px;

    font-size:
        clamp(42px,8vw,78px);

    line-height:1;

    font-weight:900;

    letter-spacing:
        clamp(0px,.3vw,3px);

    text-align:center;

    background:

        linear-gradient(
            90deg,
            #ffffff,
            #ffb2ce,
            #ff4d8b,
            #ffd6e5,
            #ffffff
        );

    background-size:400% 100%;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:
        titleGradient
        5s
        linear
        infinite;

    text-shadow:
        0 0 35px
        rgba(255,60,140,.25);
}

@keyframes titleGradient{

    to{
        background-position:400%;
    }
}


/* =========================================================
   EMOJI LINE
========================================================= */

.emoji-line{

    display:flex;

    align-items:center;
    justify-content:center;

    flex-wrap:wrap;

    gap:8px;

    margin-top:22px;

    font-size:25px;
}

.emoji-line span{

    display:inline-block;

    animation:
        emojiFloat
        2.5s
        ease-in-out
        infinite;
}

.emoji-line span:nth-child(2){
    animation-delay:.15s;
}

.emoji-line span:nth-child(3){
    animation-delay:.30s;
}

.emoji-line span:nth-child(4){
    animation-delay:.45s;
}

.emoji-line span:nth-child(5){
    animation-delay:.60s;
}

.emoji-line span:nth-child(6){
    animation-delay:.75s;
}

.emoji-line span:nth-child(7){
    animation-delay:.90s;
}

.emoji-line span:nth-child(8){
    animation-delay:1.05s;
}

@keyframes emojiFloat{

    50%{
        transform:
            translateY(-10px)
            rotate(8deg)
            scale(1.14);
    }
}


/* =========================================================
   MAIN BUTTON
========================================================= */

.main-button{

    position:relative;

    margin-top:28px;

    border:0;

    min-width:190px;

    padding:
        14px 28px;

    border-radius:100px;

    color:white;

    font-size:16px;

    font-weight:800;

    letter-spacing:.5px;

    cursor:pointer;

    background:

        linear-gradient(
            90deg,
            #ff176d,
            #ff5c9a,
            #d000ff,
            #ff176d
        );

    background-size:300% 100%;

    box-shadow:

        0 12px 35px
        rgba(255,20,110,.30);

    animation:
        buttonGradient
        4s
        linear
        infinite;

    transition:
        transform .25s,
        box-shadow .25s;

    overflow:hidden;
}

.main-button::before{

    content:"";

    position:absolute;

    width:60px;
    height:180%;

    top:-40%;

    left:-90px;

    background:
        rgba(255,255,255,.30);

    transform:
        rotate(25deg);

    animation:
        shine
        3.5s
        infinite;
}

.main-button:hover{

    transform:
        translateY(-4px)
        scale(1.05);

    box-shadow:

        0 18px 45px
        rgba(255,20,120,.50);
}

.main-button:active{

    transform:
        scale(.94);
}

@keyframes buttonGradient{

    to{
        background-position:300%;
    }
}

@keyframes shine{

    0%,45%{
        left:-90px;
    }

    65%,100%{
        left:120%;
    }
}


/* =========================================================
   SMALL BUTTONS
========================================================= */

.action-row{

    display:flex;

    justify-content:center;
    align-items:center;

    flex-wrap:wrap;

    gap:10px;

    margin-top:18px;

    max-width:520px;
}

.action{

    width:47px;
    height:47px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    border:
        1px solid
        rgba(255,255,255,.16);

    background:
        rgba(255,255,255,.065);

    color:white;

    font-size:22px;

    cursor:pointer;

    backdrop-filter:blur(10px);

    box-shadow:
        0 8px 22px
        rgba(0,0,0,.25);

    transition:
        transform .25s,
        background .25s,
        box-shadow .25s;
}

.action:hover{

    transform:
        translateY(-6px)
        scale(1.12)
        rotate(6deg);

    background:
        rgba(255,60,140,.18);

    box-shadow:

        0 12px 30px
        rgba(255,30,120,.30);
}

.action:active{

    transform:
        scale(.85);
}


/* =========================================================
   FLOATING EMOJI
========================================================= */

.float-emoji{

    position:fixed;

    left:0;
    top:0;

    pointer-events:none;

    z-index:100;

    font-size:25px;

    animation:
        floatEmoji
        var(--duration)
        cubic-bezier(.2,.8,.2,1)
        forwards;

    filter:
        drop-shadow(
            0 0 10px
            rgba(255,60,150,.65)
        );
}

@keyframes floatEmoji{

    0%{

        transform:
            translate(
                var(--start-x),
                var(--start-y)
            )
            rotate(0)
            scale(.3);

        opacity:0;
    }

    10%{
        opacity:1;
    }

    55%{

        transform:
            translate(
                var(--mid-x),
                var(--mid-y)
            )
            rotate(180deg)
            scale(1.1);
    }

    100%{

        transform:
            translate(
                var(--end-x),
                var(--end-y)
            )
            rotate(360deg)
            scale(.8);

        opacity:0;
    }
}


/* =========================================================
   BURST EMOJI
========================================================= */

.burst{

    position:fixed;

    pointer-events:none;

    z-index:200;

    font-size:27px;

    animation:
        burst
        .9s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}

@keyframes burst{

    0%{

        transform:
            translate(-50%,-50%)
            scale(.2)
            rotate(0);

        opacity:1;
    }

    100%{

        transform:

            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )

            rotate(var(--r))

            scale(1.35);

        opacity:0;
    }
}


/* =========================================================
   FLASH
========================================================= */

.flash{

    position:fixed;

    inset:0;

    z-index:180;

    pointer-events:none;

    background:
        radial-gradient(
            circle,
            rgba(255,90,160,.30),
            transparent 55%
        );

    animation:
        flash
        .7s
        forwards;
}

@keyframes flash{

    0%{
        opacity:0;
    }

    25%{
        opacity:1;
    }

    100%{
        opacity:0;
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    body{
        background:
            radial-gradient(
                circle at 50% 40%,
                rgba(255,30,120,.16),
                transparent 35%
            ),
            #070008;
    }

    .stage{
        padding:10px;
    }

    .card{

        width:100%;
        height:calc(100vh - 20px);

        min-height:0;

        border-radius:30px;

        padding:
            20px 14px;
    }

    .orb{
        filter:blur(65px);
    }

    .gift-wrap{

        width:175px;
        height:170px;
    }

    .gift-box{
        width:115px;
        height:92px;
    }

    .gift-lid{
        width:135px;
        bottom:89px;
    }

    .gift-bow{
        bottom:103px;
        font-size:40px;
    }

    .gift-halo{
        width:190px;
        height:190px;
    }

    .tap-label{
        font-size:10px;
        letter-spacing:3px;
    }

    .big-heart{

        width:125px;
        height:125px;
    }

    .heart-emoji{
        font-size:78px;
    }

    .title{

        font-size:
            clamp(38px,12vw,55px);

        margin-top:5px;
    }

    .emoji-line{

        font-size:22px;

        gap:5px;

        margin-top:17px;

        max-width:310px;
    }

    .main-button{

        margin-top:22px;

        min-width:175px;

        padding:
            13px 22px;

        font-size:15px;
    }

    .action-row{

        gap:8px;

        max-width:330px;

        margin-top:15px;
    }

    .action{

        width:43px;
        height:43px;

        font-size:20px;
    }

    .corner{
        font-size:18px;
    }

}


/* =========================================================
   SMALL MOBILE
========================================================= */

@media(max-width:380px){

    .card{
        padding:15px 10px;
    }

    .gift-wrap{
        transform:scale(.86);
        margin-bottom:-10px;
    }

    .title{
        font-size:36px;
    }

    .emoji-line{
        font-size:19px;
    }

    .action{
        width:40px;
        height:40px;
        font-size:18px;
    }

    .main-button{
        margin-top:16px;
    }
}


/* =========================================================
   LANDSCAPE MOBILE
========================================================= */

@media(
    max-height:600px
) and (
    max-width:900px
){

    .card{
        height:calc(100vh - 14px);
        border-radius:25px;
        padding:10px;
    }

    .gift-wrap{
        transform:scale(.65);
        margin-top:-25px;
        margin-bottom:-40px;
    }

    .big-heart{
        transform:scale(.65);
        margin-top:-25px;
        margin-bottom:-20px;
    }

    .title{
        font-size:35px;
    }

    .emoji-line{
        margin-top:8px;
    }

    .main-button{
        margin-top:12px;
    }

    .action-row{
        margin-top:8px;
    }
}

</style>
</head>


<body>


<!-- =======================================================
     BACKGROUND
======================================================= -->

<div class="page">

    <div class="aurora"></div>

    <div class="orb orb1"></div>

    <div class="orb orb2"></div>

    <canvas id="particles"></canvas>

</div>


<!-- =======================================================
     STAGE
======================================================= -->

<main class="stage">


<div
    class="card"
    id="card"
>


    <div class="card-light"></div>


    <!-- CORNER EMOJIS -->

    <div class="corner a">💗</div>
    <div class="corner b">✨</div>
    <div class="corner c">🫶</div>
    <div class="corner d">💘</div>


    <!-- =================================================
         INITIAL GIFT SCREEN
    ================================================== -->

    <section
        class="gift-screen"
        id="giftScreen"
    >

        <div class="gift-halo"></div>


        <div
            class="gift-wrap"
            id="gift"
            aria-label="Open gift"
        >

            <div class="gift-lid"></div>

            <div class="gift-bow">
                🎀
            </div>

            <div class="gift-box"></div>

        </div>


        <div
            class="tap-label"
            id="tapLabel"
        >
            🎁 TAP TO OPEN 🎁
        </div>

    </section>


    <!-- =================================================
         REVEAL
    ================================================== -->

    <section
        class="reveal"
        id="reveal"
    >


        <!-- HEART -->

        <div class="big-heart">

            <div class="heart-emoji">
                💖
            </div>

        </div>


        <!-- TITLE -->

        <h1 class="title">
            Love My Jaan
        </h1>


        <!-- EMOJIS -->

        <div class="emoji-line">

            <span>💗</span>
            <span>💖</span>
            <span>💘</span>
            <span>💕</span>
            <span>💞</span>
            <span>💓</span>
            <span>🥰</span>
            <span>🫶</span>
            <span>❤️‍🔥</span>

        </div>


        <!-- MAIN CLICK -->

        <button
            class="main-button"
            id="mainButton"
        >
            💖 CLICK ME 💖
        </button>


        <!-- ACTION BUTTONS -->

        <div class="action-row">


            <button
                class="action"
                data-type="love"
                aria-label="Love"
            >
                💗
            </button>


            <button
                class="action"
                data-type="kiss"
                aria-label="Kiss"
            >
                😘
            </button>


            <button
                class="action"
                data-type="hug"
                aria-label="Hug"
            >
                🫂
            </button>


            <button
                class="action"
                data-type="heart"
                aria-label="Heart"
            >
                💘
            </button>


            <button
                class="action"
                data-type="flower"
                aria-label="Flowers"
            >
                🌹
            </button>


            <button
                class="action"
                data-type="sparkle"
                aria-label="Sparkle"
            >
                ✨
            </button>


            <button
                class="action"
                data-type="party"
                aria-label="Party"
            >
                🎉
            </button>


            <button
                class="action"
                data-type="fire"
                aria-label="Fire"
            >
                ❤️‍🔥
            </button>


        </div>


    </section>


</div>

</main>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const card =
    document.getElementById("card");

const gift =
    document.getElementById("gift");

const giftScreen =
    document.getElementById("giftScreen");

const reveal =
    document.getElementById("reveal");

const tapLabel =
    document.getElementById("tapLabel");

const mainButton =
    document.getElementById("mainButton");


/* =========================================================
   EMOJI COLLECTIONS
========================================================= */

const emojiSets = {

    love:[
        "💗",
        "💖",
        "💘",
        "💕",
        "💞",
        "💓",
        "💝",
        "🩷",
        "❤️"
    ],

    kiss:[
        "😘",
        "💋",
        "🥰",
        "😍",
        "💗",
        "💕",
        "💖"
    ],

    hug:[
        "🫂",
        "🤗",
        "🥰",
        "🫶",
        "💗",
        "💕",
        "💞"
    ],

    heart:[
        "💘",
        "💝",
        "💖",
        "💗",
        "💓",
        "💕",
        "❤️‍🔥"
    ],

    flower:[
        "🌹",
        "🌸",
        "🌷",
        "🌺",
        "🌻",
        "💐",
        "🪷",
        "🌼"
    ],

    sparkle:[
        "✨",
        "💫",
        "🌟",
        "⭐",
        "🪄",
        "💖"
    ],

    party:[
        "🎉",
        "🎊",
        "🥳",
        "🎀",
        "✨",
        "💖",
        "💃"
    ],

    fire:[
        "❤️‍🔥",
        "🔥",
        "💖",
        "💗",
        "💘",
        "✨"
    ]

};


/* =========================================================
   RANDOM ITEM
========================================================= */

function randomItem(array){

    return array[
        Math.floor(
            Math.random() *
            array.length
        )
    ];

}


/* =========================================================
   GIFT OPEN
========================================================= */

let opened = false;

gift.addEventListener(
    "click",
    openGift
);

gift.addEventListener(
    "touchend",
    function(e){

        e.preventDefault();

        openGift();

    }
);


function openGift(){

    if(opened)
        return;

    opened = true;


    /* gift animation */

    gift.classList.add("open");

    tapLabel.innerHTML =
        "💖 💗 💕 💘 💞 💓 💝";


    /* small delay before reveal */

    setTimeout(
        ()=>{

            giftScreen.classList.add("hide");

        },
        650
    );


    /* celebration */

    setTimeout(
        ()=>{

            celebration(
                window.innerWidth / 2,
                window.innerHeight / 2
            );

        },
        500
    );


    /* reveal title */

    setTimeout(
        ()=>{

            reveal.classList.add("show");

        },
        900
    );

}


/* =========================================================
   CELEBRATION
========================================================= */

function celebration(x,y){

    createFlash();


    const collection =
        emojiSets.love;


    /* center explosion */

    for(
        let i=0;
        i<75;
        i++
    ){

        setTimeout(
            ()=>{

                createBurst(
                    x,
                    y,
                    collection
                );

            },
            i * 13
        );

    }


    /* falling emojis */

    for(
        let i=0;
        i<45;
        i++
    ){

        setTimeout(
            ()=>{

                createFloating(
                    randomItem(collection),
                    Math.random()*innerWidth,
                    -30
                );

            },
            i * 30
        );

    }

}


/* =========================================================
   MAIN BUTTON
========================================================= */

mainButton.addEventListener(
    "click",
    ()=>{

        const collection =
            emojiSets.love;


        createFlash();


        for(
            let i=0;
            i<45;
            i++
        ){

            setTimeout(
                ()=>{

                    createBurst(
                        innerWidth/2,
                        innerHeight/2,
                        collection
                    );

                },
                i*18
            );

        }


        for(
            let i=0;
            i<30;
            i++
        ){

            setTimeout(
                ()=>{

                    createFloating(
                        randomItem(collection),
                        Math.random()*innerWidth,
                        innerHeight + 30
                    );

                },
                i*35
            );

        }


        mainButton.innerHTML =
            "💗 💖 💕 💘 💞 💓";


        setTimeout(
            ()=>{

                mainButton.innerHTML =
                    "💖 CLICK ME 💖";

            },
            1800
        );

    }
);


/* =========================================================
   ACTION BUTTONS
========================================================= */

document
.querySelectorAll(".action")
.forEach(
    button=>{

        button.addEventListener(
            "click",
            ()=>{

                const type =
                    button.dataset.type;

                const collection =
                    emojiSets[type];


                /* burst */

                for(
                    let i=0;
                    i<22;
                    i++
                ){

                    setTimeout(
                        ()=>{

                            createBurst(
                                innerWidth/2,
                                innerHeight/2,
                                collection
                            );

                        },
                        i*20
                    );

                }


                /* floating */

                for(
                    let i=0;
                    i<16;
                    i++
                ){

                    setTimeout(
                        ()=>{

                            createFloating(
                                randomItem(collection),
                                Math.random()*innerWidth,
                                innerHeight + 20
                            );

                        },
                        i*35
                    );

                }

            }
        );

    }
);


/* =========================================================
   BURST
========================================================= */

function createBurst(
    x,
    y,
    collection
){

    const element =
        document.createElement("div");


    element.className =
        "burst";


    element.textContent =
        randomItem(collection);


    element.style.left =
        x + "px";


    element.style.top =
        y + "px";


    element.style.setProperty(
        "--x",
        (Math.random()*420 - 210) + "px"
    );


    element.style.setProperty(
        "--y",
        (Math.random()*420 - 210) + "px"
    );


    element.style.setProperty(
        "--r",
        (Math.random()*720 - 360) + "deg"
    );


    document.body.appendChild(
        element
    );


    setTimeout(
        ()=>element.remove(),
        1000
    );

}


/* =========================================================
   FLOATING EMOJI
========================================================= */

function createFloating(
    emoji,
    x,
    y
){

    const element =
        document.createElement("div");


    element.className =
        "float-emoji";


    element.textContent =
        emoji;


    const endX =
        x +
        (Math.random()*260 - 130);


    const midX =
        x +
        (Math.random()*180 - 90);


    element.style.setProperty(
        "--start-x",
        x + "px"
    );


    element.style.setProperty(
        "--start-y",
        y + "px"
    );


    element.style.setProperty(
        "--mid-x",
        midX + "px"
    );


    element.style.setProperty(
        "--mid-y",
        (y - innerHeight*.45) + "px"
    );


    element.style.setProperty(
        "--end-x",
        endX + "px"
    );


    element.style.setProperty(
        "--end-y",
        (y - innerHeight - 100) + "px"
    );


    element.style.setProperty(
        "--duration",
        (4 + Math.random()*3) + "s"
    );


    document.body.appendChild(
        element
    );


    setTimeout(
        ()=>element.remove(),
        8000
    );

}


/* =========================================================
   FLASH
========================================================= */

function createFlash(){

    const flash =
        document.createElement("div");

    flash.className =
        "flash";

    document.body.appendChild(
        flash
    );

    setTimeout(
        ()=>flash.remove(),
        800
    );

}


/* =========================================================
   CONTROLLED BACKGROUND EMOJIS
========================================================= */

setInterval(
    ()=>{

        if(
            !opened ||
            document.hidden
        )
            return;


        createFloating(
            randomItem(
                [
                    "💗",
                    "✨",
                    "💕",
                    "💖"
                ]
            ),

            Math.random() *
            innerWidth,

            innerHeight + 30

        );

    },
    1100
);


/* =========================================================
   MOUSE 3D EFFECT
========================================================= */

document.addEventListener(
    "mousemove",
    e=>{

        if(
            window.innerWidth <= 700
        )
            return;


        const x =
            e.clientX /
            window.innerWidth -
            .5;


        const y =
            e.clientY /
            window.innerHeight -
            .5;


        card.style.transform =

            `rotateX(${-y*5}deg)
             rotateY(${x*7}deg)`;

    }
);


/* reset */

document.addEventListener(
    "mouseleave",
    ()=>{

        card.style.transform =
            "rotateX(0deg) rotateY(0deg)";

    }
);


/* =========================================================
   CLICK ANYWHERE → SMALL HEART
========================================================= */

document.addEventListener(
    "click",
    e=>{

        if(
            e.target.closest(".gift-wrap") ||
            e.target.closest(".main-button") ||
            e.target.closest(".action")
        )
            return;


        if(!opened)
            return;


        createBurst(
            e.clientX,
            e.clientY,
            emojiSets.love
        );

    }
);


/* =========================================================
   TOUCH EFFECT
========================================================= */

document.addEventListener(
    "touchstart",
    e=>{

        if(!opened)
            return;


        const touch =
            e.touches[0];


        if(!touch)
            return;


        createBurst(
            touch.clientX,
            touch.clientY,
            emojiSets.love
        );

    },
    {passive:true}
);


/* =========================================================
   PARTICLE SYSTEM
========================================================= */

const canvas =
    document.getElementById(
        "particles"
    );

const ctx =
    canvas.getContext("2d");


let particles = [];


function resizeCanvas(){

    canvas.width =
        window.innerWidth *
        window.devicePixelRatio;

    canvas.height =
        window.innerHeight *
        window.devicePixelRatio;


    canvas.style.width =
        window.innerWidth + "px";

    canvas.style.height =
        window.innerHeight + "px";


    ctx.setTransform(
        window.devicePixelRatio,
        0,
        0,
        window.devicePixelRatio,
        0,
        0
    );

}


resizeCanvas();


window.addEventListener(
    "resize",
    resizeCanvas
);


/* create particles */

for(
    let i=0;
    i<90;
    i++
){

    particles.push({

        x:
            Math.random() *
            window.innerWidth,

        y:
            Math.random() *
            window.innerHeight,

        size:
            Math.random()*1.8+.3,

        speed:
            Math.random()*.35+.05,

        alpha:
            Math.random()*.7+.1,

        drift:
            Math.random()*1.2-0.6

    });

}


/* animate */

function animateParticles(){

    ctx.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );


    particles.forEach(
        p=>{

            p.y -= p.speed;

            p.x +=
                Math.sin(
                    p.y*.008
                ) *
                .15 +
                p.drift*.02;


            if(p.y < -10){

                p.y =
                    window.innerHeight +
                    10;

                p.x =
                    Math.random() *
                    window.innerWidth;

            }


            ctx.beginPath();


            ctx.arc(
                p.x,
                p.y,
                p.size,
                0,
                Math.PI*2
            );


            ctx.fillStyle =
                `rgba(
                    255,
                    180,
                    215,
                    ${p.alpha}
                )`;


            ctx.fill();

        }
    );


    requestAnimationFrame(
        animateParticles
    );

}


animateParticles();


/* =========================================================
   CHANGE MAIN HEART DYNAMICALLY
========================================================= */

const heart =
    document.querySelector(
        ".heart-emoji"
    );


const heartTypes = [

    "💖",
    "💗",
    "💘",
    "💝",
    "💞",
    "🩷",
    "❤️‍🔥"

];


let heartIndex = 0;


setInterval(
    ()=>{

        if(!opened)
            return;


        heartIndex++;


        heart.textContent =
            heartTypes[
                heartIndex %
                heartTypes.length
            ];

    },
    1800
);

</script>

</body>
</html>
